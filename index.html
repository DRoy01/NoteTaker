<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11141b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="To-Do">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>To-Do</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600&family=Inter+Tight:wght@800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="drag.css">
<script type="module" src="app.js"></script>
</head>
<body>

<main id="view-signin" class="signin" hidden>
  <p class="eyebrow">Synced to-do</p>
  <h1>Sign in</h1>
  <form id="signin-form" class="card">
    <input id="si-email" type="email" placeholder="email" autocomplete="username" required>
    <input id="si-pass" type="password" placeholder="password" autocomplete="current-password" required>
    <button type="submit" class="btn btn-primary">Sign in</button>
    <p id="si-error" class="error" role="alert"></p>
  </form>
</main>

<div id="view-list" class="app" hidden>
  <main class="list-col">
    <header class="top">
      <p class="eyebrow" id="count-label">Tasks · 0 open</p>
      <span id="status-pill" class="pill" data-status="synced"><i></i><span>Synced</span></span>
    </header>
    <h1>What's next?</h1>

    <form id="add-form" class="add">
      <input id="add-input" type="text" placeholder="What's on your mind?" autocomplete="off" enterkeyhint="done">
      <button type="submit" class="add-btn" aria-label="Add task">+</button>
    </form>
    <p class="hand hint">type it, hit enter, done.</p>

    <nav class="tabs">
      <button type="button" data-tab="open" class="active">Open <span id="n-open">0</span></button>
      <button type="button" data-tab="done">Done <span id="n-done">0</span></button>
    </nav>

    <section id="views" class="views" aria-label="Views">
      <div class="vrow">
        <span class="eyebrow">View</span>
        <div class="seg" id="view-seg" role="group" aria-label="View">
          <button type="button" data-view="all">All</button>
          <button type="button" data-view="groups">Groups</button>
          <button type="button" data-view="deadlines">Deadlines</button>
        </div>
        <span id="showing" class="showing" hidden></span>
      </div>
      <div id="group-chips" class="vrow chips" hidden></div>
      <div id="dl-controls" hidden>
        <div class="vrow">
          <span class="eyebrow">Sort</span>
          <div class="seg" id="sort-seg" role="group" aria-label="Sort">
            <button type="button" data-sort="asc">Soonest</button>
            <button type="button" data-sort="desc">Latest</button>
          </div>
        </div>
        <div class="vrow">
          <span class="eyebrow">Filter</span>
          <div class="seg" id="filter-seg" role="group" aria-label="Filter">
            <button type="button" data-filter="all">All</button>
            <button type="button" data-filter="overdue">Overdue</button>
            <button type="button" data-filter="today">Today</button>
            <button type="button" data-filter="week">This week</button>
            <button type="button" data-filter="custom">Custom</button>
          </div>
        </div>
        <div class="vrow" id="custom-range" hidden>
          <label class="eyebrow" for="f-from">From</label><input id="f-from" type="date">
          <label class="eyebrow" for="f-to">To</label><input id="f-to" type="date">
        </div>
      </div>
    </section>

    <ul id="task-list" class="tasks"></ul>
    <p id="empty" class="hand empty" hidden></p>

    <footer class="foot"><button type="button" id="signout" class="link">Sign out</button></footer>
  </main>

  <aside id="panel-detail" class="panel" hidden>
    <div class="panel-head">
      <button type="button" id="panel-close" class="link" aria-label="Close"><span class="x-desk">✕</span><span class="x-mob">‹ Back</span></button>
      <p class="eyebrow">Detail</p>
    </div>
    <input id="d-title" class="d-title" type="text" maxlength="500" aria-label="Title">
    <label class="eyebrow" for="d-notes">Notes</label>
    <textarea id="d-notes" rows="8" placeholder="Add details any time…"></textarea>
    <div class="field">
      <label class="eyebrow" for="d-group">Group</label>
      <input id="d-group" type="text" list="groups-list" maxlength="40" placeholder="No group" autocomplete="off">
      <datalist id="groups-list"></datalist>
    </div>
    <div class="field">
      <span class="eyebrow" id="d-color-label">Color</span>
      <div id="d-colors" class="swatches" role="radiogroup" aria-labelledby="d-color-label"></div>
    </div>
    <div class="field">
      <label class="eyebrow" for="d-deadline">Deadline</label>
      <div class="dl-row">
        <input id="d-deadline" type="date">
        <button type="button" id="d-dl-clear" class="btn btn-small">Clear</button>
      </div>
      <span id="d-dl-chip" class="dl-chip big" hidden></span>
    </div>
    <p id="d-meta" class="eyebrow dim"></p>
    <button type="button" id="d-delete" class="btn btn-danger">Delete</button>
  </aside>
</div>

<div id="toast" class="toast" hidden><span id="toast-text"></span><button type="button" id="toast-undo" class="link amber">Undo</button></div>

</body>
</html>
